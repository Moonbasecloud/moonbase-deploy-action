name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, shellcheck, actionlint, Skill drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The action's own tests: recorded responses and a stand-in for curl,
      # no network and no key.
      - name: Tests
        run: bash test/run.sh

      # shellcheck is installed on GitHub's Ubuntu runners. Errors and warnings
      # fail the job; style notes do not.
      # SC2319 is excluded on purpose: scripts/package-mission.sh reads $? right
      # after a [[ =~ ]] test to tell "no match" (1) from "bad regex" (2). That
      # file is a byte-identical copy of the moonbase Skill's script (see the
      # drift check below), so it is not edited here.
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: |
          shellcheck --version
          shellcheck --severity=warning --exclude=SC2319 scripts/*.sh test/*.sh

      # actionlint at a pinned release, fetched with its official download script.
      - name: actionlint
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color examples/deploy.yml .github/workflows/*.yml

      # The two helper scripts must equal the moonbase Skill's copies at the
      # commit pinned in test/check-skill-drift.sh.
      - name: Skill drift check
        if: ${{ !cancelled() }}
        run: bash test/check-skill-drift.sh
